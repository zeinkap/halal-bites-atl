name: Playwright tests

on:
  pull_request:
    paths:
      - 'tests/**'
      - 'src/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Add these as repository secrets/variables. Nothing sensitive is stored in this file.
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      ALLOWED_TEST_DB: ${{ vars.ALLOWED_TEST_DB }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Cache the browser download (~150 MB) per Playwright version. The system libraries it needs are
      # apt packages, which are not cached, so they are installed on every run.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Tests run against the production build (playwright.config.ts starts it with `npm run start`
      # when CI is set). The build needs DATABASE_URL (the sitemap reads restaurants) from the job env.
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'prisma/schema.prisma', 'next.config.mjs') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build
        run: npm run build
      # Only tests generated by the test orchestrator (tagged @orchestrated). The older
      # hand-written specs are not run here until they are verified against the test DB.
      - name: Run Playwright
        run: npm run test:agent -- --grep @orchestrated
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
