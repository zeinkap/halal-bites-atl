name: Playwright tests

on:
  pull_request:
    paths:
      - 'tests/**'
      - 'src/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Add these as repository secrets/variables. Nothing sensitive is stored in this file.
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      ALLOWED_TEST_DB: ${{ vars.ALLOWED_TEST_DB }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      # Only tests generated by the test orchestrator (tagged @orchestrated). The older
      # hand-written specs are not run here until they are verified against the test DB.
      - name: Run Playwright
        run: npm run test:agent -- --grep @orchestrated
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
